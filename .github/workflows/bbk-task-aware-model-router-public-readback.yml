name: Verify public BBK task-aware router entry
on:
  push:
    branches: [delivery/bbk-task-aware-model-router-20260908]
permissions: {}
jobs:
  anonymous-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify exact anonymous raw and blob body
        env:
          EXPECTED_GIT_BLOB: 8835be4c9d689983b27d2cf5cdf591c0bb182edf
          ENTRY: prompts/recipient-readable-handoffs/ONE_SHOT_BBK_TASK_AWARE_MODEL_ROUTER.md
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, time, urllib.request
          repo, sha, path = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA'], os.environ['ENTRY']
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          results = []
          for kind, url in [('raw', f'https://raw.githubusercontent.com/{repo}/{sha}/{path}'), ('blob', f'https://github.com/{repo}/blob/{sha}/{path}')]:
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'BBK-router-public-readback'})
                      with opener.open(request, timeout=20) as response:
                          status = response.status
                          data = response.read(4 * 1024 * 1024 + 1)
                      assert status == 200 and len(data) <= 4 * 1024 * 1024
                      if kind == 'raw':
                          git_blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                          assert git_blob == os.environ['EXPECTED_GIT_BLOB'], f'git blob mismatch: {git_blob}'
                          for marker in (b'bbk_coordinator', b'gpt-6-astra', b'bbk_gemini_batch', b'ACTIVE_TASK_AWARE_ROUTING'):
                              assert marker in data, f'missing marker: {marker!r}'
                      else:
                          assert b'BBK Local Task-Aware Multi-Model Router Setup' in data
                      results.append({'kind': kind, 'url': url, 'http': status, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
                      break
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(2 * (attempt + 1))
          print('BBK_ROUTER_PUBLIC_READBACK=' + json.dumps({'status':'PASS','commit':sha,'expected_git_blob':os.environ['EXPECTED_GIT_BLOB'],'auth':'NONE','cookies':'NONE','reader':'github-hosted-ubuntu-python-urllib','time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':results,'scope':'public instruction access only; local router activation NOT_RUN'}, sort_keys=True))
          PY
