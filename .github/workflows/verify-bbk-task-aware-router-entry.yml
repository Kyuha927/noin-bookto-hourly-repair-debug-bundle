name: Verify public BBK task-aware router entry
on:
  push:
    branches: [delivery/bbk-task-aware-model-router-20260908]
permissions: {}
jobs:
  anonymous-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify raw and blob body without credentials
        env:
          ENTRY: prompts/recipient-readable-handoffs/ONE_SHOT_BBK_TASK_AWARE_MODEL_ROUTER.md
          EXPECTED_GIT_BLOB: 9be60e8b075ef631ad9c3908c2b9115f8ef483ae
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, time, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          path = os.environ['ENTRY']
          expected_blob = os.environ['EXPECTED_GIT_BLOB']
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          urls = {
              'raw': f'https://raw.githubusercontent.com/{repo}/{sha}/{path}',
              'blob': f'https://github.com/{repo}/blob/{sha}/{path}',
          }
          results = []
          raw = None
          for kind, url in urls.items():
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent':'BBK-router-public-readback'})
                      with opener.open(request, timeout=20) as response:
                          status = response.status
                          data = response.read(2 * 1024 * 1024 + 1)
                      assert status == 200 and len(data) <= 2 * 1024 * 1024
                      if kind == 'raw':
                          raw = data
                          observed_blob = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
                          assert observed_blob == expected_blob, (observed_blob, expected_blob)
                          text = data.decode('utf-8')
                          for marker in ('Gemini 3.8 Flash', 'GPT-6 Astra High', 'GPT-5.6 Sol High',
                                         'ACTIVE_TASK_AWARE_ROUTER', 'Begin now in the existing local session'):
                              assert marker in text, marker
                      else:
                          assert b'ONE_SHOT_BBK_TASK_AWARE_MODEL_ROUTER' in data
                          assert b'Gemini 3.8 Flash' in data
                      results.append({'kind':kind, 'url':url, 'http':status, 'bytes':len(data),
                                      'sha256':hashlib.sha256(data).hexdigest()})
                      break
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(2 * (attempt + 1))
          assert raw is not None
          print('BBK_ROUTER_PUBLIC_READBACK=' + json.dumps({
              'status':'PASS', 'repository':repo, 'commit':sha, 'path':path,
              'expected_git_blob':expected_blob,
              'observed_git_blob':hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest(),
              'raw_bytes':len(raw), 'raw_sha256':hashlib.sha256(raw).hexdigest(),
              'auth':'NONE', 'cookies':'NONE', 'reader':'github-hosted-ubuntu-python-urllib',
              'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'results':results,
              'scope':'public prompt accessibility only; local router activation and model canaries NOT_RUN by this workflow'
          }, sort_keys=True))
          PY
