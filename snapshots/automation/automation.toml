aim/target 0이 fresh 증명될 때만 canonical safe resume를 검토한다.\n\nBookto/Newto 숫자 suffix는 route identity가 아니다. current lane checksum과 multitab_config의 fresh suffix만 사용한다. current route 자체가 fresh SITE_ROUTE_UNAVAILABLE이거나 fresh DOM이 새 host를 방출할 때만 canonical transaction으로 정확히 N→N+1 한 단계 smoke하고 route·본문·hash·중복·품질을 확인한다. suffix range scan, 대체 host 추측, Playwright/curl production, 우회 브라우저는 금지한다. background-only Chrome/CDP와 checksum-bound NewMac/OldMac controls만 사용한다.\n\n인기 우선순위는 /Users/NEWMAC/Documents/noin/상태/POPULARITY_ALL_VIEW_DATA_GT5M_TRUSTED_OR_RECOVERED_20260623.jsonl 및 hash-bound PRIORITY.jsonl의 외부 공개 근거만 사용한다. Bookto wr_hit·DOM·수집/파일/배정 순서를 인기라고 부르지 않는다. eligible=true를 scrape부터 QA/devices/INCLUDE까지 먼저 완료한다. 미검증 작품은 claim 가능한 최상위 한 항목에 서로 다른 외부 경로 2개와 직접 근거 또는 접근 실패를 item-specific receipt로 남긴다. 충족 시 authoritative source/overlay를 hash-bound 재생성하고 불명확하면 인기 추정 없이 보존한다.\n\nOldMac item 전체 PASS 및 original_manifest/hash 완성 전 merge·재배정·확장을 금지한다. PASS 뒤에만 current canonical collect/merge control로 manifest-derived 파일을 수집·hash 검증·경로 정규화·멱등 merge하고 canonical completed +1과 두 번째 merge NOOP을 확인한다. 이후에만 immutable generation, intersection 0, omission 0, 독립 progress/output/cache/profile/port/lock을 검증하고 CPU/memory/quality gate마다 안전하게 확장한다.\n\n매 회차 종료 전 contract receipt_root 아래에 global_fresh_state_cycle_receipt.v1 JSON을 원자 기록한다. contract_id/contract_sha256, canonical_state_observed_at_epoch, completed_at_epoch, canonical_state_paths 전체의 path/sha256/mtime_ns state_readback, progress path별 before_sha256/after_sha256 movement_evidence, movement, backlog_remaining, repair(count/executed/item_key/post_repair_verified), retry(same_failure_count/diagnostic_route_changed), escalation_executed, manual_external_gate, status_only=false, duplicate_claims=0, protected_state_preserved=true를 포함한다. repair는 최대 1회이며 executed=true이면 item_key와 post_repair_verified=true가 필수다. backlog>0이고 movement=false이면 repair, materially different diagnostic escalation, fresh manual/external gate 중 하나가 실제로 있어야 한다. receipt SH